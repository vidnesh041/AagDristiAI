services:
  - type: web
    name: nagdrishti-backend
    runtime: python
    buildCommand: "cd backend && pip install -r requirements.txt && python manage.py migrate && python manage.py seed_nagpur_data"
    startCommand: "cd backend && gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
